<svg width="1120" height="520" viewBox="0 0 1120 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1120" height="520" rx="28" fill="#F7F3EA"/>
  <text x="58" y="78" fill="#111827" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="900">它是 gate，不是商业计划生成器。</text>
  <text x="58" y="120" fill="#4B5563" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20">结论决定下一步该把时间投入哪条工作流。</text>
  <rect x="70" y="188" width="280" height="190" rx="22" fill="#111827"/>
  <text x="112" y="250" fill="#F97316" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">KILL</text>
  <text x="112" y="306" fill="#F7F3EA" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20">停止，或只做一个</text>
  <text x="112" y="336" fill="#F7F3EA" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20">反证验证。</text>
  <rect x="420" y="188" width="280" height="190" rx="22" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
  <text x="462" y="250" fill="#0F766E" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">PIVOT</text>
  <text x="462" y="306" fill="#374151" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20">改切入点，</text>
  <text x="462" y="336" fill="#374151" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20">然后重新压测。</text>
  <rect x="770" y="188" width="280" height="190" rx="22" fill="#A7F3D0"/>
  <text x="812" y="250" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">GO</text>
  <text x="812" y="306" fill="#111827" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20">进入 office-hours</text>
  <text x="812" y="336" fill="#111827" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20">或 startup-design。</text>
  <path d="M350 284 C378 284 392 284 420 284" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <path d="M700 284 C728 284 742 284 770 284" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
</svg>
